<svg width="400" height="140" viewBox="0 0 400 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" />
      <feOffset dx="1" dy="1" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Sprout -->
  <g transform="translate(155, 5) scale(0.5)">
    <path d="M50 90C50 90 52 65 68 55C84 45 95 50 95 35C95 20 75 10 55 30C50 35 50 40 50 40C50 40 50 35 45 30C25 10 5 20 5 35C5 50 16 45 32 55C48 65 50 90 50 90Z" fill="#059669"/>
    <path d="M50 40V90" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- KRUSHIKUTA -->
  <text x="200" y="90" font-family="serif" font-weight="900" font-size="62" text-anchor="middle" fill="#065f46" stroke="#065f46" stroke-width="1.5" letter-spacing="2" filter="url(#shadow)">KRUSHIKUTA</text>
  
  <!-- Secondary tagline in script style -->
  <text x="280" y="125" font-family="cursive" font-style="italic" font-size="28" text-anchor="middle" fill="#991b1b" font-weight="bold">for better future...</text>
</svg>
